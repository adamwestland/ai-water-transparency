name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Validate JSON Schema
        run: |
          npx ajv-cli validate -s data/schema.json -d data/providers.json
          npx ajv-cli validate -s data/history.schema.json -d data/history.json
      - name: Check data integrity
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            node scripts/check-data.mjs FETCH_HEAD
          else
            node scripts/check-data.mjs
          fi
      - name: Build
        run: npm run build
