name: Claude Review

# Advisory review against REVIEW.md. It comments on the PR and does not block merging.
# Billed to the repo owner's Claude plan through CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets aren't available to fork or Dependabot PRs, so skip those.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md for the project rules, then follow REVIEW.md
            exactly: which passes apply, how to verify sources, how to label findings, and the nit cap.
            Use `gh pr diff` and `gh pr view` to see the change. For data changes, fetch the cited
            source URLs to check the claims.

            Post inline comments for specific lines, then one summary comment with `gh pr comment`.
            Do not approve or request changes, and do not push commits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),WebFetch,WebSearch,Read,Glob,Grep"
