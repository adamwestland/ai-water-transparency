name: Link Check

# Weekly check that every source URL in data/providers.json still resolves.
# Broken links (404/410, dead domain, redirect to a home page) open or update
# one issue labelled `link-check`; the issue closes itself once links pass.
# On pull requests that touch the dataset it reports only (it is not a
# required check, so a flaky site can't block a merge).

on:
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC (09:00 Mexico City)
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['data/providers.json']

concurrency:
  group: link-check-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Check source links
        id: check
        run: |
          node scripts/check-links.mjs --report link-report.md || true
          # No report means the script itself crashed, which should fail the job loudly.
          test -s link-report.md
          cat link-report.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^### Broken' link-report.md; then echo "broken=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open, update or close the link-check issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Broken source links"
          existing=$(gh issue list --label link-check --state open --json number --jq '.[0].number')
          { cat link-report.md; echo; echo "_Found by the weekly [link check]($RUN_URL)._"; } > issue-body.md

          if [ "${{ steps.check.outputs.broken }}" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file issue-body.md
            else
              gh label create link-check --color D93F0B --description "Dead source link found by the weekly link check" --force
              gh issue create --title "$TITLE" --label link-check --body-file issue-body.md
            fi
          elif [ -n "$existing" ]; then
            # Close only when every link the issue lists as broken now checks out OK. A link
            # that moved to "could not verify" (bot wall, outage) keeps the issue open as is.
            listed=$(gh issue view "$existing" --json body --jq .body | tr -d '\r' \
              | awk '/^### /{s=($0=="### Broken")} s && /^\| https:/{print $2}')
            pending=""
            for url in $listed; do
              grep -qF "| $url |" link-report.md && pending="$pending $url"
            done
            if [ -z "$pending" ]; then
              gh issue close "$existing" --reason completed --comment "The links listed here all resolve again as of the [latest check]($RUN_URL)."
            else
              echo "Leaving #$existing open; still unverified:$pending"
            fi
          fi

      - name: Fail the PR check on broken links
        if: github.event_name == 'pull_request' && steps.check.outputs.broken == 'true'
        run: |
          echo "::error::Broken source links found; see the job summary."
          exit 1
